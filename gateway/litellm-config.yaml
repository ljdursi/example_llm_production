# ─────────────────────────────────────────────────────────────────────────────
# THE file to understand in this repo.
#
# Each entry in model_list maps a *stable, user-facing model name* (what
# researchers put in their tools) to *whatever currently serves it*. Growing
# the service = editing litellm_params here; users never reconfigure anything.
#
# Phase 0 (now):   every model is a hosted endpoint at build.nvidia.com.
# Phase 1:         change api_base to your own NIM container. That's the
#                  whole migration. See docs/03-swapping-in-self-hosted-nim.md.
#
# Browse available hosted models at https://build.nvidia.com — every model
# card shows its exact id (the string after "openai/" below). Model ids date
# quickly (the catalog already carries newer generations than the ones below);
# the stable user-facing names on the left are what insulate your users from
# that churn — check the catalog when you set this up, not just this file.
# This is not hypothetical: hosted ids reach end-of-life and start returning
# HTTP 410 Gone, at which point the *name* keeps working only because you
# repoint it here. Verify each id resolves before you hand keys out.
#
# After ANY edit to this file, reload the gateway so it re-reads the config:
#   compose:  docker compose restart gateway
#   k8s:      kubectl -n llm-service rollout restart deploy/litellm
# (Recreating with `up -d` alone does NOT reload — the config is mounted, and
# LiteLLM reads it once at startup.)
# ─────────────────────────────────────────────────────────────────────────────

model_list:
  # ── "coder": the initial use case — research software development ─────────
  # The "openai/" prefix means "speak the OpenAI chat-completions protocol to
  # api_base". NIM endpoints (hosted or self-hosted) are OpenAI-compatible, so
  # this same stanza works for both — which is exactly why swapping is easy.
  - model_name: coder
    litellm_params:
      # Chosen to exist BOTH as a hosted endpoint (Phase 0) and a downloadable
      # NIM (Phase 1), so the same name survives the self-hosting cutover. Note
      # it's a 47B-param MoE: self-hosting needs ~2× A100/H100-class GPUs — to
      # test the Phase 1 *pattern* on smaller hardware, temporarily point this
      # at a small model (e.g. meta/llama-3.2-3b-instruct) per docs/03.
      model: openai/mistralai/mixtral-8x7b-instruct-v0.1
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      # Per-token prices — see the "A note on pricing" block below. These are
      # ILLUSTRATIVE, not what NVIDIA charges. Without them, spend logs record
      # $0.00 for every request and dollar budgets (max_budget) never bind.
      input_cost_per_token: 0.00001    # $0.01 per 1K input tokens (fake)
      output_cost_per_token: 0.00003   # $0.03 per 1K output tokens (fake)
    model_info:
      description: "Code generation & review for research software development"

  # ── "general": chat, Q&A, and (later) paper summarization ─────────────────
  - model_name: general
    litellm_params:
      model: openai/meta/llama-3.3-70b-instruct
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      input_cost_per_token: 0.00001    # $0.01 per 1K input tokens (fake — see below)
      output_cost_per_token: 0.00003   # $0.03 per 1K output tokens (fake — see below)
    model_info:
      description: "General assistant / summarization"

  # ── Template: adding your NEXT model is a copy-paste of this stanza ────────
  # - model_name: summarizer            # the stable name users will call
  #   litellm_params:
  #     model: openai/<id from the build.nvidia.com model card>
  #     api_base: https://integrate.api.nvidia.com/v1
  #     api_key: os.environ/NVIDIA_API_KEY
  #
  # ── Template: the SAME model name served by YOUR hardware (Phase 1) ────────
  # Replace (or duplicate — see routing note below) a stanza with:
  # - model_name: coder
  #   litellm_params:
  #     model: openai/mistralai/mixtral-8x7b-instruct-v0.1   # whatever your NIM actually serves
  #     api_base: http://nim-coder:8000/v1   # your NIM container / k8s Service
  #     api_key: none                        # self-hosted NIM does no auth; the gateway is the auth layer
  #
  # Routing note: if TWO stanzas share a model_name, LiteLLM load-balances
  # between them. Useful for a zero-downtime migration: add the self-hosted
  # entry, watch it take traffic, then remove the hosted one.

  # ── A note on pricing (the input_cost_per_token / output_cost_per_token above)
  # LiteLLM denominates budgets in dollars against a per-model price table. It
  # has NO prices for these custom model names (nor, in general, for arbitrary
  # hosted or self-hosted endpoints), so unless you supply them every request
  # costs $0.00, /spend logs show $0.00, and a `max_budget` in dollars can never
  # be reached — budgets silently do nothing.
  #
  # The values above are DELIBERATELY FAKE, present so the budget machinery is
  # live and demonstrable out of the box. They're calibrated for fair-use
  # accounting, not real cost: at ~$0.01/$0.03 per 1K in/out tokens, a small
  # test budget (`make create-key USER_ID=demo BUDGET=0.02`) is exhausted in a
  # handful of requests — so you can watch enforcement kick in well before the
  # free tier's request-rate limit does. Replace them with your own notional
  # per-token rates (fair-use "credits" for an academic service) or, once you
  # self-host, real amortized cost — and re-run the budget check in docs/02.

litellm_settings:
  drop_params: true          # ignore client params a backend doesn't support, instead of erroring
  num_retries: 2
  request_timeout: 600       # generous: big code-gen responses on busy GPUs are slow
  callbacks: ["prometheus"]  # gateway metrics on /metrics (open source since
                             # LiteLLM v1.80.0): request rates and token counts
                             # per model/key. Postgres (/spend) remains the
                             # billing-grade usage record — see docs/05-monitoring.md.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # admin credential — mint user keys with it
  database_url: os.environ/DATABASE_URL       # persistence for keys/users/spend
